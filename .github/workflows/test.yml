name: Test

# The repository's test workflow. Called by the pull-request CI (python-pr.yml) and by the
# shared Release workflow (release.yml), so a release is gated by exactly what a PR is gated by.
# Moved unchanged from the `test` job of python-pr.yml (same steps, Python 3.13); the only
# differences are the SHA-pinned action versions (same majors as before), explicit
# permissions and a timeout. The repository does not produce JUnit XML today, so no
# release-test-results-* artifact is uploaded.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source code
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4.9.1
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tests
        run: |
          python -m pip install pytest
          pytest

      - name: Report Test Results
        if: failure()
        run: |
          echo "::error::Some tests failed. Check the logs for details."
