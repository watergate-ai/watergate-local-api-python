# release-init: managed. Generated by bin/release-init from .github/release-config.yml: re-run it to update this file.
# Delete this line to take the file over (release-init then leaves it alone). See RELEASING.md.
name: Release

on:
  workflow_dispatch:
    inputs:
      type:
        description: release (from the default branch) or hotfix (from a hotfix/* branch)
        type: choice
        options: [release, hotfix]
        default: release
        required: true
      ref:
        description: "Leave empty: the branch you run this workflow from (\"Use workflow from\"; the default branch for a release, a hotfix/* branch for a hotfix). If set, it must be that branch: the tests run there."
        type: string
        default: ""
        required: false
      override-version:
        description: "Exceptional: the version to cut instead of the computed one (YYYY.N.P)"
        type: string
        required: false
      publish-to-confluence:
        description: Publish the release page to Confluence (only when release.confluence is configured)
        type: boolean
        default: true
      dry-run:
        description: Print the plan and write nothing
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # The repository's own tests (also what its pull-request CI runs). Release is blocked when they fail.
  test:
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read
    secrets: inherit

  release:
    needs: test
    uses: watergate-ai/release-workflows/.github/workflows/release.yml@v1
    # The shared workflow cannot ask for more than its caller grants; Deploy needs all three.
    permissions:
      contents: write
      deployments: write
      id-token: write
    with:
      type: ${{ inputs.type }}
      ref: ${{ inputs.ref }}
      override-version: ${{ inputs.override-version }}
      publish-to-confluence: ${{ inputs.publish-to-confluence }}
      dry-run: ${{ inputs.dry-run }}
    secrets: inherit
