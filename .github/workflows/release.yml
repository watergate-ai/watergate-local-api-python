name: Release

# Publish to PyPI when a GitHub Release is published. The released version is the
# release's git tag (via setuptools-scm) - there is no version file to bump.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build and test distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history + tags so setuptools-scm derives the version

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip build
          pip install -r requirements.txt

      - name: Run tests
        run: pytest

      - name: Build sdist and wheel
        run: python -m build

      - name: Store the distribution
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # OIDC: PyPI Trusted Publishing, no API token needed
    steps:
      - name: Download the distribution
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
