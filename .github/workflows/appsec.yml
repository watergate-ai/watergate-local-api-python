# release-init: managed. Generated by bin/release-init: re-run it to update this file.
# Delete this line to take the file over (release-init then leaves it alone). See RELEASING.md.
name: AppSec

# Secret scan (gitleaks), authorization fail-open rules (Semgrep) and, for Elixir repositories, Sobelow. One definition for every repository:
# docs/appsec.md in watergate-ai/release-workflows. Not the dependency audit (that is `test / audit`).
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  appsec:
    uses: watergate-ai/release-workflows/.github/workflows/appsec.yml@v1
    permissions:
      contents: read
    with:
      sobelow-dirs: '[]'
      semgrep-blocking: false
