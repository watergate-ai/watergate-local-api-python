# release-init: managed. Generated by bin/release-init from .github/release-config.yml: re-run it to update this file.
# Delete this line to take the file over (release-init then leaves it alone). See RELEASING.md.
name: Validate release config

# Checks .github/release-config.yml on every pull request that changes it or the release workflows.
on:
  pull_request:
    paths:
      - .github/release-config.yml
      - .github/workflows/release.yml
      - .github/workflows/deploy.yml
      - .github/workflows/test.yml
      - .github/workflows/release-config-check.yml

permissions:
  contents: read

jobs:
  validate:
    uses: watergate-ai/release-workflows/.github/workflows/validate-config.yml@v1
    permissions:
      contents: read
    secrets: inherit
