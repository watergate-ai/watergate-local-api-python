name: Test Pull Request

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tests
        run: |
          python -m pip install pytest
          pytest

      - name: Report Test Results
        if: failure()
        run: |
          echo "::error::Some tests failed. Check the logs for details."

  # Dependency scan in its own job: credential-free checkout and a
  # contents:read token, so the third-party container action never sees the
  # workflow's other permissions or any persisted credentials.
  dependency_scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      # Scans dependencies for known vulnerabilities. Blocking: the build fails
      # if any known vulnerability is present.
      #
      # Run via the container directly rather than the action so we can assert
      # that dependency resolution actually happened. requirements.txt needs a network
      # round-trip to resolve transitive versions, and if that is rate-limited
      # the scanner FALLS BACK TO OFFLINE EXTRACTION and reports "No issues
      # found" with exit 0 - a silently green gate. The grep below turns that
      # into a failure instead.
      - name: OSV vulnerability scan
        run: |
          set -uo pipefail
          out=$(docker run --rm -v "$PWD":/src:ro \
            ghcr.io/google/osv-scanner-action:v2.5.1 \
            --lockfile=/src/requirements.txt 2>&1); rc=$?
          echo "$out"
          if echo "$out" | grep -q "falling back to offline extraction"; then
            echo "::error::Dependency resolution failed - the scan could not see"
            echo "::error::transitive dependencies, so this result is not trustworthy."
            exit 1
          fi
          exit $rc
