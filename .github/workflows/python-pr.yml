name: Test Pull Request

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tests
        run: |
          python -m pip install pytest
          pytest

      - name: Report Test Results
        if: failure()
        run: |
          echo "::error::Some tests failed. Check the logs for details."

  # Dependency scan in its own job: credential-free checkout and a
  # contents:read token, so the third-party container action never sees the
  # workflow's other permissions or any persisted credentials.
  dependency_scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      # Scans dependencies for known vulnerabilities. Non-blocking for now:
      # as of 2026-08-20 this repo has 36 known vulnerabilities across 4
      # packages, so gating on it would block every PR. Remove
      # continue-on-error once the backlog is cleared.
      - name: OSV vulnerability scan
        uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
        with:
          scan-args: |-
            --lockfile=./requirements.txt
        continue-on-error: true
